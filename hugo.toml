baseURL = "https://meikesofia.nl/"
locale = "nl-NL"
defaultContentLanguage = "nl"
title = "Meike"
theme = "terminal"
enableRobotsTXT = true
enableGitInfo = false

[params]
  contentTypeName = "posts"
  showMenuItems = 5
  fullWidthTheme = false
  centerTheme = true
  autoCover = false
  subtitle = "De persoonlijke blog van Meike: een roze terminal vol dingen die ik graag wil vertellen."
  menuMore = "Meer"
  readMore = "Lees verder"
  readOtherPosts = "Lees andere berichten"
  dateFormat = "2 January 2006"
  missingContentMessage = "Pagina niet gevonden"
  missingBackButtonLabel = "Terug naar de homepage"

  [params.logo]
    logoText = "meike"

[pagination]
  pagerSize = 6

[taxonomies]
  tag = "tags"

[permalinks]
  posts = "/blog/:year/:month/:slug/"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "over-mij"
    name = "Over mij"
    url = "/over-mij/"
    weight = 2
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 3
