baseURL = "https://meikesofia.nl/"
locale = "nl-NL"
defaultContentLanguage = "nl"
title = "Meike"
theme = "terminal"
enableRobotsTXT = true
enableGitInfo = false
paginate = 6

[params]
  contentTypeName = "posts"
  showMenuItems = 5
  fullWidthTheme = false
  centerTheme = true
  autoCover = false
  subtitle = ""
  keywords = ""
  menuMore = "Meer"
  readMore = "Lees verder"
  readOtherPosts = "Lees andere berichten"
  dateFormat = "2 January 2006"

  [params.logo]
    logoText = "mmeik"

[taxonomies]
  tag = "tags"

[permalinks]
  posts = "/blog/:year/:month/:slug/"

[outputs]
  home = ["HTML", "RSS", "Sitemap"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "over-mij"
    name = "Over mij"
    url = "/over-mij/"
    weight = 2
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 3

[sitemap]
  changefreq = "weekly"
  priority = 0.5
