<ul class="menu menu--mobile">
  <li><button type="button" class="menu__trigger" aria-expanded="false" aria-controls="mobiel-menu">Menu&nbsp;▾</button></li>
  <li>
    <ul class="menu__dropdown" id="mobiel-menu">
      {{ range $.Site.Menus.main }}
        {{ if not .HasChildren }}
          <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
      {{ end }}
    </ul>
  </li>
</ul>
