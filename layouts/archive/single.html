{{ define "main" }}
  <article class="post">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-content">{{ .Content }}</div>
    {{ $posts := where .Site.RegularPages "Type" "posts" }}
    {{ range $posts.GroupByDate "2006" }}
      <section aria-labelledby="jaar-{{ .Key }}">
        <h2 id="jaar-{{ .Key }}">{{ .Key }}</h2>
        <ul>
          {{ range .Pages }}
            <li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 januari" }}</time> — <a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
          {{ end }}
        </ul>
      </section>
    {{ end }}
  </article>
{{ end }}
